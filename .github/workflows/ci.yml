name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "*.*.*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm exec tsc -b --pretty false
      - name: Kitchen-sink Axe (web)
        run: CI=true pnpm exec vitest run apps/kitchen-sink/src/App.test.tsx
